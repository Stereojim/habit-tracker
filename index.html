<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5a5">
  <title>Ватсон — что происходит?</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Ватсон</h1>
      <p class="header-tagline">что происходит?</p>
      <div class="header-actions">
        <span id="balance" class="balance">Баллы: 0</span>
        <label class="mode-toggle" title="План / Факт">
          <span class="mode-label" id="mode-label">План</span>
          <input type="checkbox" id="mode-switch">
          <span class="mode-slider"></span>
          <span class="mode-label" id="mode-label2">Результат</span>
        </label>
        <button id="profile-btn" class="profile-btn">👤</button>
        <button id="export">Экспорт</button>
        <button id="add-habit" class="primary">+ Привычка</button>
      </div>
    </div>
  </header>

  <main>
    <section id="today-section">
      <div class="today-head">
        <h2 id="today-title">План на сегодня</h2>
        <div class="today-actions">
          <button id="auto-plan" class="ghost">Автоплан</button>
          <span id="plan-progress" class="plan-progress"></span>
        </div>
      </div>
      <div id="day-circles" class="day-circles"></div>
      <div id="plan-list"></div>
      <div class="mood-block">
        <span class="mood-hint">Настроение за день</span>
        <div id="mood-picker" class="mood-picker"></div>
      </div>
    </section>

    <section id="calendar-section">
      <div class="cal-header">
        <button id="prev-month">‹</button>
        <span id="month-label"></span>
        <button id="next-month">›</button>
      </div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span>
        <span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div id="calendar-row" class="cal-grid"></div>
    </section>

    <section id="habits-section">
      <div class="today-head">
        <h2>Привычки</h2>
        <button id="add-habit2" class="ghost">+ Привычка</button>
      </div>
      <div id="habit-list"></div>
    </section>
  </main>

  <div id="habit-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title" class="modal-title">Новая привычка</h3>
      <label>Название
        <input id="habit-title" type="text" placeholder="Например, Вода">
      </label>
      <label>Баллы за выполнение
        <input id="habit-points" type="number" min="0" value="1">
      </label>
      <div class="form-row">
        <label>Тип
          <select id="habit-bad">
            <option value="0">Хорошая</option>
            <option value="1">Плохая</option>
          </select>
        </label>
        <div id="penalty-block" class="penalty-block">
          <span class="penalty-hint">Штраф при срыве серии</span>
          <div class="form-row">
            <label>Множитель
               <span class="penalty-note">0.9 = −10% за день</span>
               <input id="habit-penalty" type="number" min="0" max="1" step="0.05" value="0.9">
            </label>
            <label>Серия (дней)
              <input id="habit-penalty-streak" type="number" min="1" value="3">
            </label>
          </div>
        </div>
        <label>Частота
          <select id="habit-unit">
            <option value="daily">Ежедневно</option>
            <option value="weekly">Раз в неделю</option>
          </select>
        </label>
        <label id="times-label">Раз в неделю
          <input id="habit-times" type="number" min="1" value="2">
        </label>
      </div>
      <div id="days-block" class="days-block">
        <span class="days-hint">Дни недели (для «Раз в неделю»)</span>
        <div id="days-pills" class="days-pills"></div>
      </div>
      <div id="levels-block">
        <p class="levels-hint">Уровни достижений (по серии)</p>
        <div id="levels-container"></div>
      </div>
      <div class="modal-actions">
        <button id="cancel-habit">Отмена</button>
        <button id="save-habit" class="primary">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title"></h3>
      <div class="modal-body"></div>
      <div class="modal-actions">
        <button id="confirm-cancel" class="modal-cancel">Отмена</button>
        <button id="confirm-ok" class="modal-ok primary"></button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">Профили</h3>
      <div id="profile-list" class="profile-list"></div>
      <div class="profile-form">
        <input id="profile-name" type="text" placeholder="Имя профиля">
        <button id="profile-add" class="primary">Добавить</button>
      </div>
      <div class="modal-actions">
        <button id="profile-close" class="modal-cancel">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
